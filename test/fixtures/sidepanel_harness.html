<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Resume Tailor (test harness)</title>
<link rel="stylesheet" href="/dist/sidepanel.css">
</head>
<body>
<div id="app">Loading...</div>
<script>
// Test-only stub of the chrome.* extension API surface, so the real
// sidepanel.js bundle can run and be exercised outside a real extension
// context (the browser automation tool can't load unpacked extensions).
window.__storageBackingStore = {};
window.chrome = {
  storage: {
    local: {
      // Real in-memory store (not a no-op) so a simulated panel
      // close/reopen (calling loadPersistedState() again) is genuine -
      // needed to test chrome.storage.local persistence across reopens.
      get: (keys) => {
        const store = window.__storageBackingStore;
        if (typeof keys === "string") return Promise.resolve({ [keys]: store[keys] });
        return Promise.resolve({ ...store });
      },
      set: (obj) => { Object.assign(window.__storageBackingStore, obj); return Promise.resolve(); },
      clear: () => { window.__storageBackingStore = {}; return Promise.resolve(); },
    },
  },
  runtime: {
    onMessage: { addListener: function () {} },
    sendMessage: (msg) => {
      window.__lastSentMessage = msg;
      if (msg.type === "OLLAMA_GENERATE") {
        return Promise.resolve({ rawText: JSON.stringify({ queries: ["Senior Backend Engineer jobs"] }) });
      }
      return Promise.resolve({ error: "not available in this test harness" });
    },
    getURL: (p) => "/dist/" + p,
  },
  tabs: {
    query: () => Promise.resolve([{ id: 1, url: "https://example.com/jobs/1", active: true }]),
    sendMessage: (tabId, msg) => Promise.reject(new Error("no real tab in this test harness")),
    create: (opts) => { window.__lastCreatedTab = opts; return Promise.resolve({ id: 999, ...opts }); },
  },
  scripting: {
    executeScript: () => Promise.reject(new Error("no real tab in this test harness")),
  },
};
</script>
<script type="module" src="/dist/sidepanel.js"></script>
</body>
</html>
